# =============================================================================
# Podman Compose — Food Reviews
# Services: app, nginx, db, redis, app-init (one-shot)
# =============================================================================

name: food-reviews

services:

  # ── Laravel Application (PHP-FPM) ──────────────────────────────────────────
  app:
    build:
      context: .
      containerfile: Containerfile
    container_name: food-reviews-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=redis
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
    env_file:
      - .env.podman
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - food-reviews-net
    healthcheck:
      test: ["CMD", "php", "-f", "/var/www/html/artisan", "--", "about", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    mem_limit: 256m
    cpu_shares: 512

  # ── Nginx Web Server ──────────────────────────────────────────────────────
  # Uses volumes_from to share the app container's filesystem,
  # giving nginx access to compiled assets and the storage volume.
  nginx:
    image: docker.io/nginx:stable-alpine
    container_name: food-reviews-nginx
    restart: unless-stopped
    ports:
      - "8004:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,Z
    volumes_from:
      - app:ro
    depends_on:
      - app
    networks:
      - food-reviews-net
    mem_limit: 64m
    cpu_shares: 256

  # ── MySQL Database ─────────────────────────────────────────────────────────
  db:
    image: docker.io/mysql:8.0
    container_name: food-reviews-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-food_reviews}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${DB_USERNAME:-food_reviews}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - food-reviews-net
    mem_limit: 512m
    cpu_shares: 512

  # ── Redis Cache, Session & Queue ──────────────────────────────────────────
  redis:
    image: docker.io/redis:7-alpine
    container_name: food-reviews-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly yes
      - --maxmemory 128mb
      - --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - food-reviews-net
    mem_limit: 128m
    cpu_shares: 256

  # ── One-shot Init: Migrations & Seeding ───────────────────────────────────
  # Runs once after DB is healthy, then exits.
  app-init:
    build:
      context: .
      containerfile: Containerfile
    container_name: food-reviews-init
    restart: "no"
    working_dir: /var/www/html
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=redis
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
    env_file:
      - .env.podman
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - food-reviews-net
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "→ Generating APP_KEY..."
        php artisan key:generate --force
        echo "→ Running migrations..."
        php artisan migrate --force
        echo "→ Seeding database..."
        php artisan db:seed --force
        echo "→ Caching config..."
        php artisan config:cache
        php artisan route:cache
        php artisan view:cache
        echo "✓ Init complete — container will exit."
    mem_limit: 256m
    cpu_shares: 256

# ── Networks ────────────────────────────────────────────────────────────────
networks:
  food-reviews-net:
    name: food-reviews-net
    driver: bridge

# ── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  db-data:
    name: food-reviews-db-data
  redis-data:
    name: food-reviews-redis-data
  app-storage:
    name: food-reviews-app-storage
