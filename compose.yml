name: food-reviews

services:
  app:
    build:
      context: .
      dockerfile: Containerfile
      target: app
    env_file: .env
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Containerfile
      target: nginx
    ports:
      - "8004:80"
    volumes:
      - app-storage:/var/www/html/storage:ro,z
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: docker.io/mysql:8.0
    env_file: .env
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: docker.io/redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    profiles:
      - redis
    restart: unless-stopped

volumes:
  app-storage:
    name: food-reviews-app-storage
  db-data:
    name: food-reviews-db-data
  redis-data:
    name: food-reviews-redis-data
